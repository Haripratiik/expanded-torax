name: quick start

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: What the workspace has
        run: python xtorax.py env
      - name: EPED-NN against EPEDNN.jl
        run: python core/epednn.py check
      - name: ITER, settled, a branch with an island and one without
        run: python examples/run_iter.py
      - name: A decision model of your own
        run: python xtorax.py script studio_iter examples/my_decision_session.json
      - name: Smoke checks a clean workspace can run
        run: python xtorax.py smoke
